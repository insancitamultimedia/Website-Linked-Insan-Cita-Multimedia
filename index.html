        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font-weight: 600;
        text-decoration: none;

      }

        outline-offset: 2px;
      }

        background: linear-gradient(100deg, var(--brand-deep), var(--brand) 45%, var(--brand-2));

      .social {

        justify-content: center;
        gap: 12px;
        margin: 40px 0 0;
        padding: 0;
        list-style: none;
      }

      .social a {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        color: var(--text);
        transition: color 0.15s ease, background 0.15s ease;
      }

      .social a:hover {
        background: var(--card);
        color: var(--brand);
      }

      .social svg {
        width: 26px;
        height: 26px;
      }

      footer {

        font-size: 0.8rem;

      @media (prefers-reduced-motion: reduce) {
